[package]
edition = "2021"
name = "hyperliquid-timescaledb-collector"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

[dependencies]
arrow-array = "56"
arrow-schema = "56"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
bigdecimal = "0.4"
diesel = { version = "2", features = ["postgres", "numeric", "chrono", "r2d2", "serde_json"] }
dotenv = "0.15"
fallible-iterator = "0.2"
hyperliquid_rust_sdk = "0.6"
mimalloc = { version = "0.1", features = ["secure"] }
parquet = { version = "56", features = ["arrow", "zstd"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
pq-sys = { version = "0.7", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
