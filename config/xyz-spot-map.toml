# Spot counterparts of xyz builder-dex perps.
#
# The Hyperliquid info API has no field that links a builder-dex perp to a spot token.
# This file is a manual mapping. Update it when xyz adds, delists or renames a perp,
# or when a spot token changes. The ingestor fails at startup if an entry does not match
# the live API.
#
# Selection criterion, used for the entries below:
# For each active `xyz:T` perp, map it to the spot pair `<T>X/USDC` (the xStock wrapped token) when that pair exists; otherwise leave the perp unmapped. Rationale: xStock tokens are issued 1:1 against the underlying share. Other tokenized families for the same ticker (for example NVDA by Wagyu.xyz and EQNVDA by EQX) are excluded by this rule, not by a judgment of their quality.
#
# Each entry has these keys:
# - perp: the builder-dex perp name, such as "xyz:NVDA".
# - spot: the spot pair name that the WebSocket subscription uses, such as "@702".
# - spot_token: the base token of that pair, such as "NVDAX". The ingestor checks it.
# - rationale: a short reason for the entry.

[[pairs]]
perp = "xyz:AAPL"
spot = "@713"
spot_token = "AAPLX"
rationale = "AAPLX quoted in USDC is the xStock token for AAPL."

[[pairs]]
perp = "xyz:CRCL"
spot = "@714"
spot_token = "CRCLX"
rationale = "CRCLX quoted in USDC is the xStock token for CRCL."

