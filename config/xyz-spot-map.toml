# Spot counterparts of xyz builder-dex perps.
#
# The Hyperliquid info API has no field that links a builder-dex perp to a spot token.
# This file maps each perp by hand, from one snapshot of the live API.
#
# Snapshot: 2026-10-27 18:08 UTC. Source: spotMetaAndAssetCtxs (dayNtlVlm) and meta with dex "xyz".
# Volumes change over time. A reviewer checks this file by hand and updates it by hand.
# The ingestor never regenerates this file at startup. It only checks the entries against the live API.
#
# Selection rule, verbatim:
# "For each active xyz:T perp, the candidates are the USDC-quoted spot pairs whose base token name contains the ticker T and whose token fullName names the same company or the ticker (checked by hand, listed below). The mapping picks the candidate with the highest 24 h notional volume (`dayNtlVlm` from `spotMetaAndAssetCtxs`) at the snapshot time. Rationale: the most liquid spot book gives the simulator the most realistic depth and the tightest spread. A perp with no candidate stays unmapped."
#
# Each entry has these keys:
# - perp: the builder-dex perp name, such as "xyz:NVDA".
# - spot: the spot pair name that the WebSocket subscription uses, such as "@702".
# - spot_token: the base token of that pair. The ingestor checks it against spotMeta.
# - rationale: a short reason for the entry.
#
# Each entry lists its rejected candidates and their volumes above the entry.
# Candidates with a null fullName are excluded. The API does not name a company or ticker for them.
# The comments below show every excluded candidate with a one-line reason.

# xyz:AAPL. Chosen: EQAAPL, 24 h volume 3860.4229.
# Rejected: AAPLX, 0.0 (Wrapped Apple xStock).
# Excluded: AAPL, 0.0 (null fullName).
[[pairs]]
perp = "xyz:AAPL"
spot = "@1157"
spot_token = "EQAAPL"
rationale = "Highest 24 h volume among candidates: EQAAPL 3860.4229, AAPLX 0.0."

# xyz:AMZN. Chosen: EQAMZN, 24 h volume 949.6098 (only candidate with a fullName).
# Excluded: AMZN, 0.0 (null fullName).
