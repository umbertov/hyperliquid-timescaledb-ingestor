services:
  ingestor:
    image: ${INGESTOR_IMAGE:-hyperliquid-timescaledb-ingestor:local}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    command: ["--paired-perp-spot"]
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
