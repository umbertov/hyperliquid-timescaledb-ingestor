services:
  collector:
    image: ${COLLECTOR_IMAGE:-hyperliquid-timescaledb-collector:local}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
